set default=0
set timeout=15
set color_normal=light-gray/black
set color_highlight=white/blue
loadfont /boot/grub/fonts/unicode.pf2
set gfxmode=1024x768
insmod all_video
insmod gfxterm
terminal_output gfxterm
set menu_color_normal=light-gray/black
set menu_color_highlight=white/blue

menuentry "Install AirLink ISP OS" {
    linux /live/vmlinuz boot=live components quiet airlink.mode=install
    initrd /live/initrd.img
}
menuentry "Try AirLink ISP OS (Live)" {
    linux /live/vmlinuz boot=live components quiet airlink.mode=live
    initrd /live/initrd.img
}
menuentry "Recovery Mode" {
    linux /live/vmlinuz boot=live components airlink.mode=recovery
    initrd /live/initrd.img
}
submenu "Advanced Options" {
    menuentry "AirLink ISP OS — safe graphics" {
        linux /live/vmlinuz boot=live components nomodeset airlink.mode=install
        initrd /live/initrd.img
    }
    menuentry "AirLink ISP OS — serial diagnostics" {
        linux /live/vmlinuz boot=live components console=tty0 console=ttyS0,115200n8 airlink.mode=live
        initrd /live/initrd.img
    }
    menuentry "UEFI Firmware Settings" { fwsetup }
}
