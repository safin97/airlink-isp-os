map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate /etc/airlink/tls.crt;
    ssl_certificate_key /etc/airlink/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    root /opt/airlink/frontend/build/web;
    index index.html;
    client_max_body_size 256k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    location / { try_files $uri $uri/ /index.html; }
    # OAuth authorization codes are short-lived secrets; omit callback access logs.
    location = /api/backups/google-drive/callback {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }
}
